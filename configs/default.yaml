# =====================================================================
# 项目常量唯一事实源（代码侧）
# 治理规则（DECISIONS.md §14）：
#   1. 目标/预算/队伍规模等决策常量，只在本文件与 DECISIONS.md 中定义；
#      PRD / ARCHITECTURE / TASKS / overview 一律引用，不得另设数值。
#   2. 改常量必须先改 DECISIONS.md（裁决），再同步本文件，并在提交信息中
#      注明 DECISIONS 章节号。
#   3. 评测物理常量与官方 metric 对齐（tests/test_metric_selfcheck.py 全绿）。
# =====================================================================

# ---- 目标（DECISIONS.md §1 裁决机制 + §15.1 滚动重估；9/2 门禁已于 9/1 晚提前触发） ----
target:
  b_board_f1_work: 0.82        # 当前工作性目标（保 80 冲 82；§15.1 降级链生效后调整，手段不减）
  b_board_f1_stretch: 0.84     # 冲刺线（原工作性目标；§1 双轨精神：增强/分辨率/后处理/预算全保留）
  b_board_f1_pred: 0.803       # 能力预测中位（§15.1 降级链：区间 79.5–81.1；两主干候选同水位级，9/5 校准）
  gap_pp: 3.7                  # 执行缺口（对冲刺线 84.0 口径）
  stage_ceiling: 0.86          # 阶段性上限
  recheck_dates: ["2026-09-05", "2026-09-10"]  # 剩余重估节点：9/5 baseline 首分 / 9/10 A 榜（9/2 已提前出结果）

# ---- 预算与队伍（DECISIONS.md §12，用户已拍板） ----
budget:
  gpu_cny_cap: 200             # 云 GPU 预算上限（元）；100 元即覆盖计划，200 含约一倍冗余
team:
  size: 1                      # 单人（Q2 已拍板）；Q5 报名已完成；Q6 可线下出席答辩

# ---- 评测物理常量（官方 metric 对齐，T11/T12 自检全绿） ----
eval:
  canvas_wh: [1366, 720]       # 评测画布 (W, H)
  line_width: 30               # cv2 描边宽度（有效宽度≈31px，IoU=0.5 边界≈10.3px）
  line_type: 8                 # 8-connected，无抗锯齿
  iou_thr: 0.5                 # TP 判定阈值（严格大于）
  spline_k: 3                  # B 样条阶数（k≤3）
  densify_step: 5.0            # 样条稠密化采样步长（px）
  tp_lateral_boundary_px: 10.3 # 实测 IoU=0.5 横向误差边界（理想模型 10px，cv2 实测 10.3px）

# ---- 模型与主干（DECISIONS.md §15.2 收口，§16.4 归位；权重事实源 docs/weight_scout_report.md） ----
model:
  name: clrnet_r50             # 默认主干（筛选先验）；T2.3 双路筛选实证后改记赢家（DECISIONS §15.2）
  fallback_chain: [clrnet_r50, adnet_r34, clrnet_convnext_t]  # 与 ARCHITECTURE §4.5 ModelConfig 同源
  pretrained: required         # baseline 一律从公开预训练权重（CULane）fine-tune，禁 from-scratch（DECISIONS §15.2）
  backbone_screen: [clrnet_r50, adnet_r34]  # 双路 15ep 筛选（§15.2，9/3 晚–9/4 晨 AutoDL）；判定：|ΔF1|<1.5pp 取 clrnet_r50
  backbone_upgrade: clrnet_convnext_t       # 9/10（T60 定模型）升级备选（UnLanedet CULane 80.21）；DLA-34 无权重勿配置

# ---- 数据与输入（DECISIONS.md §15.4 收口） ----
data:
  input_size: [800, 320]       # 网络输入 (W,H)，与 ARCHITECTURE §4 DataConfig 同源；T55 另有 960×480 等 preset 对比

# ---- 验证与统计纪律 ----
validation:
  split: by_clip               # 按视频段 hold-out，禁止按图随机切
  val_clips: 8                 # hold-out 段数（默认 8，区间 6–10，EDA 后按场景覆盖定，固化到 configs/splits/v1_seed42.yaml）
  decision_thr_pp: 2.0         # 消融判定阈值：CI 下界提升须 > 2.0pp（含 J4 网格扫描采纳条件）
  noise_band_pp: 1.7           # 同批现测噪声带（±1.7pp 内视为噪声）
  seeds: [101, 202, 303]       # 多种子对比实验（ARCHITECTURE §8.2 同源）；默认训练 seed=42
  train_seed: 42               # 默认训练种子（ARCHITECTURE §8.2 同源）
